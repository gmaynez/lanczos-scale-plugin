# SPDX-License-Identifier: GPL-3.0-or-later

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Package Windows (x86-64-v2)
    runs-on: windows-2025

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Keep Git checkouts MSYS2-friendly
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-gimp
            mingw-w64-clang-x86_64-nsis

      - name: Configure
        run: >
          meson setup build-release
          -Dplugin=enabled
          -Dcpu-baseline=x86-64-v2
          --buildtype=release
          -Db_lto=true

      - name: Build
        run: meson compile -C build-release

      - name: Test
        run: meson test -C build-release --print-errorlogs

      - name: Build NSIS installer
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch rest <<< "$version"
          patch="${patch:-0}"
          product_version="${major}.${minor}.${patch}"
          product_version_quad="${product_version}.0"
          cd installer
          makensis \
            -DBUILD_DIR=build-release \
            -DPRODUCT_VERSION="$product_version" \
            -DPRODUCT_VERSION_QUAD="$product_version_quad" \
            lanczos-scale.nsi
          mv lanczos-scale-windows-x86_64-installer.exe ../dist/

      - name: Package
        shell: pwsh
        run: |
          $package = "dist/lanczos-scale-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$package/lanczos-scale" | Out-Null
          Copy-Item -LiteralPath "build-release/lanczos-scale.exe" -Destination "$package/lanczos-scale/lanczos-scale.exe" -Force
          Copy-Item -LiteralPath "README.md" -Destination "$package/README.md" -Force
          Copy-Item -LiteralPath "LICENSE" -Destination "$package/LICENSE" -Force
          $installInfo = @"
          Windows installation
          ====================

          1. Close GIMP.
          2. Open your GIMP 3 user plug-ins folder:
             %APPDATA%\GIMP\3.2\plug-ins
          3. Copy the lanczos-scale folder from this zip into that plug-ins folder.
          4. Start GIMP and use Image > Lanczos Scale... or Layer > Lanczos Scale...

          The installed path should look like:
          %APPDATA%\GIMP\3.2\plug-ins\lanczos-scale\lanczos-scale.exe

          The folder basename and executable basename must both be lanczos-scale.
          "@
          Set-Content -LiteralPath "$package/INSTALL-WINDOWS.txt" -Value $installInfo -Encoding UTF8
          $baselineInfo = @"
          CPU baseline: x86-64-v2
          Optimized Windows build targeting x86-64-v2 (SSE3/SSSE3/SSE4.1/SSE4.2/POPCNT).

          Install by copying the lanczos-scale directory into the GIMP 3 plug-ins directory:
          %APPDATA%\GIMP\3.2\plug-ins

          The directory basename and executable basename must both be lanczos-scale.
          "@
          Set-Content -LiteralPath "$package/CPU-BASELINE.txt" -Value $baselineInfo -Encoding UTF8
          Compress-Archive -Path "$package/*" -DestinationPath "dist/lanczos-scale-windows-x86_64.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: lanczos-scale-windows-x86_64
          path: |
            dist/lanczos-scale-windows-x86_64.zip
            dist/lanczos-scale-windows-x86_64-installer.exe

  publish:
    name: Publish GitHub release
    needs: windows
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: lanczos-scale-windows-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
          body: |
            ## Windows install

            ### Installer (recommended)

            Download and run `lanczos-scale-windows-x86_64-installer.exe`. The installer will detect your GIMP 3 configuration and install the plug-in to the correct location. Close GIMP before installing.

            ### Manual install

            Download `lanczos-scale-windows-x86_64.zip`. This build targets x86-64-v2 (SSE3/SSSE3/SSE4.1/SSE4.2/POPCNT) for a good balance of performance and compatibility. Close GIMP, unzip the package, and copy the contained `lanczos-scale` folder to:

            ```text
            %APPDATA%\GIMP\3.2\plug-ins
            ```

            The final path should be:

            ```text
            %APPDATA%\GIMP\3.2\plug-ins\lanczos-scale\lanczos-scale.exe
            ```

            Restart GIMP, then use `Image > Lanczos Scale...` or `Layer > Lanczos Scale...`.
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
