name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (${{ matrix.os }}, ${{ matrix.cpu-baseline }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cpu-baseline: generic
          - os: ubuntu-24.04
            cpu-baseline: x86-64-v3
          - os: ubuntu-24.04-arm
            cpu-baseline: generic
          - os: ubuntu-24.04-arm
            cpu-baseline: armv8-a
          - os: macos-15-intel
            cpu-baseline: generic
          - os: macos-15
            cpu-baseline: generic

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade meson ninja

      - name: Configure
        run: >
          meson setup build
          -Dplugin=disabled
          -Dcpu-baseline=${{ matrix.cpu-baseline }}
          --buildtype=release

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  windows-plugin:
    name: Windows plug-in (${{ matrix.cpu-baseline }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        cpu-baseline: [ generic, x86-64-v3 ]

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Keep Git checkouts MSYS2-friendly
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-gimp

      - name: Configure
        run: >
          meson setup build
          -Dplugin=enabled
          -Dcpu-baseline=${{ matrix.cpu-baseline }}
          --buildtype=release
          -Db_lto=true

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs
